<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lì xì Tết - Lion Dance Event</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://i.imgur.com/kOfemlP.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }
    .banner {
      width: 90vw;
      margin: 0 auto;
      text-align: center;
      margin-top: 35px;
      position: relative;
      z-index: 2;
    }
    .bling {
      font-size: 3em;
      font-weight: bold;
      color: #FFD700;
      letter-spacing: 6px;
      text-shadow:
        0 0 8px #FFD700,
        0 0 16px #FF4500,
        0 0 25px #fff,
        1px 1px 2px #222;
      animation: bling 1s infinite alternate;
    }
    @keyframes bling {
      from { text-shadow: 0 0 10px #FFD700, 0 0 20px #FF4500, 1px 1px 2px #222; }
      to { text-shadow: 0 0 25px #FFD700, 0 0 35px #FF4500, 1px 1px 2px #222; }
    }
    .lion-side {
      width: 120px;
      height: auto;
      position: absolute;
      top: 5px;
      z-index: 3;
    }
    .lion-left {
      left: 2vw;
      transform: scaleX(-1);
    }
    .lion-right {
      right: 2vw;
    }
    .playmusic-btn {
      background-color: #FF2323;
      border-radius: 6px;
      padding: 14px 40px;
      font-size: 1.5em;
      color: #fff;
      margin: 12px auto 18px auto;
      border: none;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 2px #FFD700, 1px 1px 2px #222;
      box-shadow: 0 2px 6px rgba(140,0,0,.15);
      transition: background 0.2s;
      display: block;
    }
    .playmusic-btn.active {
      background-color: #FFD700;
      color: #C00;
    }
    #lion-main {
      display: block;
      margin: 20px auto;
      width: 220px;
      transition: opacity 0.4s;
    }
    #envelopes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 18px auto;
      gap: 40px;
      max-width: 900px;
      z-index: 2;
      position: relative;
    }
    .envelope {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      padding: 0;
      transition: transform 0.15s;
      z-index: 2;
      outline: none;
    }
    .envelope img {
      width: 110px;
      height: auto;
      filter: drop-shadow(0 0 30px #FFD700);
      transition: transform 0.2s;
    }
    .envelope-number {
      position: absolute;
      top: 12px;
      right: 10px;
      font-size: 2em;
      color: #FFD700;
      text-shadow: 0 0 5px #FF2323;
      font-weight: bold;
      user-select: none;
    }
    .envelope.opened img {
      filter: blur(2px) grayscale(0.7);
      opacity: 0.5;
    }
    #money-popup {
      display: none;
      position: fixed;
      top: 25vh;
      left: 0;
      right: 0;
      margin: auto;
      width: 380px;
      padding: 35px 30px;
      background: rgba(255, 255, 220, 0.97);
      border-radius: 21px;
      box-shadow: 0 0 46px #FFD700, 0 0 6px #FF2323, 0 1px 5px #222;
      text-align: center;
      z-index: 25;
      animation: popShow .3s;
    }
    @keyframes popShow {
      from { transform: scale(.5); opacity: .2; }
      to { transform: scale(1); opacity: 1; }
    }
    .money-amount {
      font-size: 3em;
      font-weight: bold;
      color: #FF2323;
      text-shadow: 0 0 12px #FFD700, 1px 2px 4px #222;
      margin-bottom: 18px;
      user-select: none;
    }
    .money-label {
      font-size: 1.4em;
      color: #C00;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .money-nextime {
      font-size: 1.5em;
      color: #555;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .playagain-btn {
      display: block;
      margin: 28px auto 0 auto;
      font-size: 1.2em;
      background: #FFD700;
      border: none;
      border-radius: 6px;
      padding: 16px 36px;
      font-weight: bold;
      color: #c00;
      cursor: pointer;
      text-shadow: 0 1px 0 #fff;
      box-shadow: 0 3px 12px rgba(220, 40, 0, .19);
      transition: background 0.2s;
    }
    .hoa-mai {
      position: fixed;
      background: url('https://i.imgur.com/Ey0Ekoq.png');
      background-size: contain;
      width: 55px; height: 45px;
      pointer-events: none;
      animation: hoaMaiFall 1.7s linear forwards;
      z-index: 9999;
    }
    @keyframes hoaMaiFall {
      from { transform: translateY(-30px) scale(1) rotate(0deg); opacity: 1; }
      to { transform: translateY(480px) scale(1.2) rotate(160deg); opacity: 0; }
    }
    @media (max-width: 700px) {
      .lion-side { width: 80px; }
      #lion-main { width: 120px; }
      #money-popup { width: 92vw; max-width: 350px; padding: 19px 6px;}
    }
  </style>
</head>
<body>
  <img src="https://i.imgur.com/qubMbDi.png" alt="Lion Left" class="lion-side lion-left">
  <img src="https://i.imgur.com/qubMbDi.png" alt="Lion Right" class="lion-side lion-right">
  <div class="banner bling">
    New Year's Red Envelope
  </div>
  <button id="playmusic-btn" class="playmusic-btn">Playmusic</button>
  <img src="https://i.imgur.com/I5vJ9kE.png" id="lion-main">
  <div id="envelopes"></div>
  <div id="money-popup">
    <div class="money-amount"></div>
    <div class="money-label"></div>
    <button id="playagain-btn" class="playagain-btn">Play Again</button>
  </div>
  <audio id="music" src="https://docs.google.com/uc?export=download&id=1sZMk9QIkEnf9u5nS63waYuQb6QEqURIW" loop preload="auto"></audio>
  <script>
    const envelopesList = [
      { value: '2500 Naira', percent: '5%', image: 'https://i.imgur.com/gJRHJpI.png' },
      { value: '1000 Naira', percent: '10%', image: 'https://i.imgur.com/gJRHJpI.png' },
      { value: '800 Naira', percent: '', image: 'https://i.imgur.com/gJRHJpI.png' },
      { value: 'nextime', percent: '10%', image: 'https://i.imgur.com/gJRHJpI.png' },
      { value: '500 Naira', percent: '', image: 'https://i.imgur.com/gJRHJpI.png' },
      { value: '700 Naira', percent: '', image: 'https://i.imgur.com/gJRHJpI.png' },
    ];
    function shuffle(arr) {
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let envelopesState = [], openedCount = 0;
    function resetEnvelopes() {
      envelopesState = shuffle([...envelopesList]);
      const envelopesDiv = document.getElementById('envelopes');
      envelopesDiv.innerHTML = '';
      openedCount = 0;
      for (let i = 0; i < envelopesState.length; i++) {
        const env = envelopesState[i];
        const btn = document.createElement('button');
        btn.className = 'envelope';
        btn.innerHTML = `<img src="${env.image}" alt="Envelope ${i+1}"><div class="envelope-number">${i+1}</div>`;
        btn.onclick = () => openEnvelope(i);
        btn.dataset.idx = i;
        envelopesDiv.appendChild(btn);
      }
      document.getElementById('lion-main').style.opacity = 1;
      document.getElementById('money-popup').style.display = 'none';
    }
    function openEnvelope(idx) {
      if(document.getElementById('money-popup').style.display==='block') return;
      document.getElementById('lion-main').style.opacity = 0;
      const envelopeBtn = document.querySelectorAll('.envelope')[idx];
      envelopeBtn.classList.add('opened');
      const env = envelopesState[idx];
      showMoneyPopup(env.value, env.percent);
      openedCount++;
    }
    function showMoneyPopup(value, percent) {
      const popup = document.getElementById('money-popup');
      popup.style.display = 'block';
      document.querySelector('.money-amount').textContent = value === 'nextime' ? '' : value;
      if (value === 'nextime') {
        document.querySelector('.money-label').innerHTML = '';
        document.querySelector('.money-label').className = 'money-nextime';
        document.querySelector('.money-label').textContent = 'Chúc may mắn lần sau!';
      } else {
        document.querySelector('.money-label').className = 'money-label';
        document.querySelector('.money-label').textContent = percent ? `Tỉ lệ ${percent}` : '';
      }
      for(let i=0;i<7;i++){
        setTimeout(() => hoaMaiEffect(), i*170);
      }
      playCashSound();
    }
    function hoaMaiEffect() {
      const hoaMai = document.createElement('div');
      hoaMai.className = 'hoa-mai';
      hoaMai.style.left = (Math.random()*85 + 5) + 'vw';
      hoaMai.style.top = '20vh';
      hoaMai.style.transform = `scale(${0.95 + Math.random()*0.3}) rotate(${Math.random()*360}deg)`;
      document.body.appendChild(hoaMai);
      setTimeout(()=>hoaMai.remove(), 1650);
    }
    function playCashSound() {
      let snd = new Audio('https://cdn.pixabay.com/audio/2022/01/20/audio_105edb2991.mp3');
      snd.volume = 0.8;
      snd.play();
    }
    document.getElementById('playagain-btn').onclick = function() {
      resetEnvelopes();
    };
    const musicEl = document.getElementById('music');
    const musicBtn = document.getElementById('playmusic-btn');
    let musicActive = false;
    musicBtn.onclick = function(){
      if(musicActive) {
        musicEl.pause();
        musicActive = false;
        musicBtn.classList.remove('active');
        musicBtn.textContent = 'Playmusic';
      } else {
        musicEl.play();
        musicActive = true;
        musicBtn.classList.add('active');
        musicBtn.textContent = 'Pausemusic';
      }
    }
    resetEnvelopes();
  </script>
</body>
</html>
