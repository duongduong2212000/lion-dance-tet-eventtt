<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Year Fortune Distribution Event</title>

<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        overflow-x: hidden;
        text-align: center;

        /* Background Tết */
        background-image: url("https://i.imgur.com/7Te2sQx.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* --- TITLE --- */
    h1 {
        color: red;
        font-size: 42px;
        margin-top: 20px;
        text-shadow: 0 0 10px gold, 0 0 20px orange;
        animation: bling 1.2s infinite;
    }

    @keyframes bling {
        0% { text-shadow: 0 0 5px gold; }
        50% { text-shadow: 0 0 20px yellow; }
        100% { text-shadow: 0 0 5px gold; }
    }

    .title-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
    }

    .mini-lion {
        width: 60px;
    }

    /* Main lion */
    #lion {
        width: 260px;
        position: absolute;
        left: -260px;
        top: 350px;
        animation: walk 7s linear infinite;
    }

    @keyframes walk {
        0%   { left: -260px; }
        50%  { left: calc(100% - 260px); }
        100% { left: -260px; }
    }

    .jump {
        animation: jumpUp 1s ease-out;
    }

    @keyframes jumpUp {
        0% { transform: translateY(0); }
        50% { transform: translateY(-160px); }
        100% { transform: translateY(0); }
    }

    /* Red envelopes */
    .envelope {
        width: 95px;
        background: linear-gradient(#ff0000, #bb0000);
        color: gold;
        border-radius: 10px;
        border: 3px solid gold;
        text-align: center;
        font-weight: bold;
        padding: 12px;
        position: absolute;
        display: none;
        box-shadow: 0 0 10px gold;
        animation: drop 1.3s ease-out forwards;
    }

    @keyframes drop {
        0% { transform: translateY(-200px) rotate(-20deg); opacity: 0; }
        100% { transform: translateY(0) rotate(0); opacity: 1; }
    }

    #musicBtn {
        margin-top: 500px;
        padding: 14px 28px;
        background: red;
        border: none;
        color: gold;
        font-size: 20px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 0 12px gold;
    }
</style>
</head>
<body>

<!-- TITLE -->
<div class="title-wrap">
    <img class="mini-lion" src="https://i.imgur.com/Hl7whZv.png">
    <h1>New Year Fortune Distribution Event</h1>
    <img class="mini-lion" src="https://i.imgur.com/Hl7whZv.png">
</div>

<!-- MAIN LION -->
<img id="lion" src="https://i.imgur.com/zznQS3N.png">

<!-- MUSIC BUTTON -->
<button id="musicBtn">Play Tết Music</button>

<!-- MUSIC FILES -->
<audio id="music" loop>
    <source src="https://dl.sndup.net/9x4p/TetHappy.mp3" type="audio/mp3">
</audio>

<audio id="sadMusic">
    <source src="https://dl.sndup.net/h8nt/SadSound.mp3" type="audio/mp3">
</audio>

<!-- RED ENVELOPES -->
<div id="env1" class="envelope">500 Naira</div>
<div id="env2" class="envelope">600 Naira</div>
<div id="env3" class="envelope">800 Naira</div>
<div id="env4" class="envelope">2500 Naira</div>
<div id="env5" class="envelope">Next Time…</div>
<div id="env6" class="envelope">1000 Naira</div>

<script>
    const lion = document.getElementById("lion");
    const envelopes = [env1, env2, env3, env4, env5, env6];

    // BUTTON MUSIC
    document.getElementById("musicBtn").onclick = () => {
        document.getElementById("sadMusic").pause();
        document.getElementById("music").play();
    };

    // LION JUMPS AND THROWS LUCKY MONEY
    setInterval(() => {
        lion.classList.add("jump");

        setTimeout(() => {
            lion.classList.remove("jump");

            // Show envelopes
            envelopes.forEach((env, i) => {
                env.style.left = (250 + i * 150) + "px";
                env.style.top = "450px";
                env.style.display = "block";
            });

            // Music rules
            document.getElementById("music").pause();
            document.getElementById("sadMusic").pause();

            if (env5.style.display === "block") {
                document.getElementById("sadMusic").play();
            } else {
                document.getElementById("music").play();
            }

        }, 450);

    }, 7000);
</script>

</body>
</html>
